<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bruk template literals</title>
</head>
<body>
    <section>
        <p id="maillink"></p>
    </section>

    <script>
        const name = "Patrik"
        const email = "paber0904@hiof.no"

        //Bygge emailen med template literal:
        const emailLink = `<a href="mailto:${email}">Send mail til ${name}</a>`

        //print email link til HTML element med id maillink
        document.getElementById("maillink").innerHTML = emailLink
    </script>
</body>
</html>
