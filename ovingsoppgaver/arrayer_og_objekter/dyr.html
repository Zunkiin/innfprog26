<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oppgave 1 arrayer og objekter</title>
</head>
<body>
    <section>

        <p id="utskrift"></p>

    </section>

    <script>

        const dyr = [`hest`, `hund`, `esel`, `gris`, `birk`, `ape`, `tiger`, `gorilla`, `pingvin`, `slange`];

        //Template literal med dyrene på index 3 og 7
        const tekst = `Her er det listet opp noen dyr, for ekesempel: ${dyr[3]} og ${dyr[7]}`


        //.join for å liste alle
        // const tekst = `Her er det listet opp noen dyr, for ekesempel: ${dyr.join(`, `)}.`;
        

        document.getElementById("utskrift").innerHTML = tekst

    </script>
</body>
</html>
